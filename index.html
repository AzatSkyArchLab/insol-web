<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insol Web — Расчёт инсоляции</title>
    
    <link rel="stylesheet" href="css/main.css">
    <link href="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/earcut@2.2.4/dist/earcut.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/osmtogeojson@3.0.0-beta.5/osmtogeojson.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- BVH для ускорения raycast (100-1000x) -->
    <script src="https://unpkg.com/three-mesh-bvh@0.5.23/build/index.umd.cjs"></script>
    <!-- JSZip для экспорта OBJ в архив -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- DXF Parser для подложек -->
    <script src="https://cdn.jsdelivr.net/npm/dxf-parser@1.1.2/dist/dxf-parser.min.js"></script>

    <!-- CFD Wind Analysis -->
    <script src="js/analysis/WindFlowAnimation.js"></script>
    <script src="js/analysis/WindCFD.js"></script>
    
</head>

<body>
    <!-- Режим 1: Карта -->
    <div id="map-mode">
        <div id="map"></div>
        
        <!-- Переключатель слоёв карты -->
        <div id="map-layer-switcher">
            <button class="layer-btn active" data-layer="osm" title="OpenStreetMap">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 7l6 -3l6 3l6 -3v13l-6 3l-6 -3l-6 3v-13"/>
                    <path d="M9 4v13"/>
                    <path d="M15 7v13"/>
                </svg>
            </button>
            <button class="layer-btn" data-layer="esri" title="Спутник (ESRI)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 2a15 15 0 0 1 4 10a15 15 0 0 1 -4 10"/>
                    <path d="M12 2a15 15 0 0 0 -4 10a15 15 0 0 0 4 10"/>
                    <path d="M2 12h20"/>
                </svg>
            </button>
        </div>
        
        <!-- Кнопка линейки на карте -->
        <div id="map-measure-btn-container">
            <button id="map-measure-btn" class="layer-btn" title="Линейка">
                <span style="font-size: 16px;">📏</span>
            </button>
        </div>
        
        <div id="info-panel">
            <h3>Insol Web</h3>
            <p>Выберите область для анализа</p>
            <button id="select-mode-btn">Выбрать область</button>
            <div id="selection-info"></div>
            <button id="load-btn" disabled>Загрузить область</button>
        </div>
    </div>
    
    <!-- Режим 2: 3D-сцена -->
    <div id="scene-mode" class="hidden">
        <div id="scene-container"></div>
        
        <!-- Переключатель слоёв в 3D-сцене -->
        <div id="scene-layer-switcher">
            <button class="layer-btn active" data-layer="osm" title="OpenStreetMap">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 7l6 -3l6 3l6 -3v13l-6 3l-6 -3l-6 3v-13"/>
                    <path d="M9 4v13"/>
                    <path d="M15 7v13"/>
                </svg>
            </button>
            <button class="layer-btn" data-layer="esri" title="Спутник (ESRI)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 2a15 15 0 0 1 4 10a15 15 0 0 1 -4 10"/>
                    <path d="M12 2a15 15 0 0 0 -4 10a15 15 0 0 0 4 10"/>
                    <path d="M2 12h20"/>
                </svg>
            </button>
        </div>
        
        <!-- Панель управления видом -->
        <div id="scene-view-controls">
            <div class="view-control-row">
                <span class="view-control-label">Сетка</span>
                <div class="view-control-toggle active" id="grid-toggle" title="Показать/скрыть сетку"></div>
            </div>
            <div class="tile-offset-controls">
                <div class="view-control-label">Сдвиг тайлов:</div>
                <div class="tile-offset-row">
                    <label>X</label>
                    <input type="range" id="tile-offset-x" min="-50" max="50" value="0" step="1">
                    <span class="offset-value" id="tile-offset-x-val">0 м</span>
                </div>
                <div class="tile-offset-row">
                    <label>Y</label>
                    <input type="range" id="tile-offset-y" min="-50" max="50" value="0" step="1">
                    <span class="offset-value" id="tile-offset-y-val">0 м</span>
                </div>
                <button class="tile-offset-reset" id="tile-offset-reset">Сбросить</button>
            </div>
        </div>
        
        <div id="scene-panel">
            <h3>3D Модель</h3>
            <p>Зданий: <span id="building-count">0</span></p>
            
            <div class="legend">
                <div class="legend-item">
                    <span class="legend-color residential"></span>
                    Жилые
                </div>
                <div class="legend-item">
                    <span class="legend-color other"></span>
                    Прочие
                </div>
            </div>
            
            <button id="back-btn">Назад к карте</button>
            <button id="underlay-btn" onclick="showUnderlayPanel()" style="margin-top: 8px;">DXF Подложки</button>
        </div>
        
        <!-- Карточка здания -->
        <div id="building-card" class="hidden">
            <div class="card-header">
                <span id="card-title">Здание</span>
                <button id="card-close">✕</button>
            </div>

            <div class="card-content">
                <div class="card-row">
                    <span class="card-label">Тип:</span>
                    <div class="card-toggle">
                        <button class="toggle-btn active" data-residential="true">Жилое</button>
                        <button class="toggle-btn" data-residential="false">Нежилое</button>
                    </div>
                </div>
                <div class="card-row">
                    <span class="card-label">Функция:</span>
                    <span id="card-function">—</span>
                </div>
                <div class="card-row">
                    <span class="card-label">Этажей:</span>
                    <span id="card-levels">—</span>
                </div>
                <div class="card-row">
                    <span class="card-label">Высота:</span>
                    <span id="card-height">—</span>
                </div>
                <div class="card-row">
                    <span class="card-label">Источник:</span>
                    <span id="card-height-source">—</span>
                </div>
                <div class="card-row">
                    <span class="card-label">Адрес:</span>
                    <span id="card-address">—</span>
                </div>
                <div class="card-row">
                    <span class="card-label">OSM ID:</span>
                    <span id="card-osm-id">—</span>
                </div>
            </div>
            
            <div class="card-actions">
                <button id="edit-height-btn">Изменить высоту</button>
                <button id="insolation-grid-btn">Инсоляционная сетка</button>
                <select id="grid-features-select" class="hidden" title="Элементы ячеек">
                    <option value="none" selected>Без окон</option>
                    <option value="windows">Окна</option>
                    <option value="balconies">Балконы + окна</option>
                </select>
                <div id="grid-depth-controls" class="hidden">
                    <label>Окно: <input type="range" id="grid-window-depth" min="0.1" max="0.5" value="0.25" step="0.05"><span id="grid-window-depth-val">0.25м</span></label>
                    <label>Балкон: <input type="range" id="grid-balcony-depth" min="0.6" max="2.0" value="1.2" step="0.1"><span id="grid-balcony-depth-val">1.2м</span></label>
                </div>
                <button id="edit-grid-btn" disabled>Редактировать сетку</button>
                <button id="apply-grid-btn" style="display:none">✓ Применить</button>
                <button id="cancel-grid-btn" style="display:none">✕ Отменить</button>
                <button id="reset-grid-btn" style="display:none">Сбросить разбивку</button>
                <button id="select-all-points-btn" class="hidden">Выбрать все точки</button>
                <button id="calculate-insolation-btn" class="hidden">Рассчитать инсоляцию</button>
            </div>
        </div>
        <!-- Конец карточки здания -->
        

        <!-- Панель результатов инсоляции (выдвижная) -->
        <div id="insolation-results" class="hidden">
            <div class="panel-header">
                <span>Результаты инсоляции</span>
                <button id="insolation-results-close" title="Закрыть">✕</button>
            </div>
            <div class="panel-content">
                <div class="result-stats">
                    <div class="stat pass">
                        <span id="stat-pass">0</span>
                        <small>Норма</small>
                    </div>
                    <div class="stat warning">
                        <span id="stat-warning">0</span>
                        <small>Квартир.</small>
                    </div>
                    <div class="stat fail">
                        <span id="stat-fail">0</span>
                        <small>Не соотв.</small>
                    </div>
                </div>
                
                <div class="result-controls">
                    <button id="toggle-rays-btn">Лучи точки</button>
                    <button id="toggle-all-rays-btn">Все лучи</button>
                </div>
                
                <div class="results-list-header">
                    Выберите точку для просмотра лучей:
                </div>
                
                <div id="insolation-details"></div>
            </div>
        </div>
        <!-- Конец панели результатов -->
        
    </div>
    <!-- Конец scene-mode -->
    
    <script type="module" src="js/main.js"></script>
</body>
</html>
